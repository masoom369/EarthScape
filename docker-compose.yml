services:
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: hadoop-namenode
    container_name: earthscape-namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hadoop_namenode_data:/hadoop/dfs/name
    environment:
      CLUSTER_NAME: earthscape
      CORE_CONF_fs_defaultFS: hdfs://hadoop-namenode:8020
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_namenode_name_dir: file:///hadoop/dfs/name
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9870/dfshealth.html"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: hadoop-datanode
    container_name: earthscape-datanode
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    ports:
      - "9864:9864"
      - "9866:9866"
      - "9867:9867"
    volumes:
      - hadoop_datanode_data:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://hadoop-namenode:8020
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_datanode_data_dir: file:///hadoop/dfs/data
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_datanode_hostname: host.docker.internal
      HDFS_CONF_dfs_datanode_http_address: 0.0.0.0:9864
      HDFS_CONF_dfs_datanode_address: 0.0.0.0:9866
      HDFS_CONF_dfs_datanode_ipc_address: 0.0.0.0:9867
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9864/datanode.html"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  hadoop-resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    hostname: hadoop-resourcemanager
    container_name: earthscape-resourcemanager
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9870 hadoop-datanode:9864"
      CORE_CONF_fs_defaultFS: hdfs://hadoop-namenode:8020
      YARN_CONF_yarn_log___aggregation___enable: "true"
      YARN_CONF_yarn_resourcemanager_recovery_enabled: "true"
      YARN_CONF_yarn_resourcemanager_store_class: org.apache.hadoop.yarn.server.resourcemanager.recovery.FileSystemRMStateStore
      YARN_CONF_yarn_resourcemanager_fs_state___store_uri: /rmstate
      YARN_CONF_yarn_nodemanager_remote___app___log___dir: /app-logs
    networks:
      - hadoop-net

  hadoop-nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    hostname: hadoop-nodemanager
    container_name: earthscape-nodemanager
    depends_on:
      hadoop-resourcemanager:
        condition: service_started
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9870 hadoop-datanode:9864 hadoop-resourcemanager:8088"
      CORE_CONF_fs_defaultFS: hdfs://hadoop-namenode:8020
    networks:
      - hadoop-net

volumes:
  hadoop_namenode_data:
  hadoop_datanode_data:

networks:
  hadoop-net:
    driver: bridge