[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "earthscape-backend"
version = "1.0.0"
description = "EarthScape Climate Agency Big Data Analytics Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
